name: Script checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for script in install.sh scripts/sync-agents.sh scripts/verify.sh tests/scripts_test.sh; do
            sh -n "$script"
          done
          ./tests/scripts_test.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/scripts_test.ps1
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/scripts_test.ps1
